# PGDR PART 1 — MANUFACTURER FIRST FINDING — derivation/rule layer.
#
# Transcribes Execution Mandate v0.2 FINAL §8 (per-entry mapping) and §9
# (R-1..R-5) one-to-one.
#
# KNOWLEDGE BOUNDARY (§4, confirmed by the owner): this file is a governed
# derivation/rule layer over manufacturer knowledge. It is NOT a manufacturer
# knowledge store and NOT a translation. Manufacturer text (designation,
# meaning, instruction, displayed message) is always read at runtime from the
# manufacturer knowledge record supplied through PI. This file holds only:
# item values, bases, rule ids, verbatim `source_phrase` anchors (verified at
# runtime as exact substrings of the live record), the fixed T6 {meaning}
# strings, and a fingerprint binding each record to the exact source text.
#
# fingerprint = sha256("document_id|entry_id|documented_meaning|
#                       documented_instruction|displayed_message"), absent = "".
# Omitted items are NOT_ESTABLISHED. A fingerprint mismatch makes the whole
# entry NOT_ESTABLISHED (audit flag). Only R-1/R-2 ever produce a stored
# DERIVED value; R-3/R-4 are review notes (why nothing is derived) and R-5
# is the triage composition (computed, never stored).

header:
  approved_by: owner
  approval_date: "2026-09-24"
  approval_reference: "PGDR Part 1 Execution Mandate v0.2 FINAL (frozen); Final Owner Authority Decisions D-C1..D-C7, A1..A4, KB"
  nature: "derivation layer over OWNER_ATTESTED_UNVERIFIED manufacturer text"
  not_a: "not a manufacturer knowledge store; not a translation"

rules:
  R-1: "Stop without resume condition -> operability DO_NOT_DRIVE, vehicle_immobilization REQUIRED"
  R-2: "Towing: operability in {DO_NOT_DRIVE, STARTING_PREVENTED} + professional_attention REQUIRED + no documented driver-side remedy -> TOWING_REQUIRED"
  R-3: "Directional instructions (go to / contact / have the vehicle checked) are not permission to drive"
  R-4: "Figures are not limits"
  R-5: "Monotonic triage composition (may raise, never lower)"

