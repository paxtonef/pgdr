  red_or_uncertain:
    heading: Arrêtez-vous en sécurité — vérification humaine nécessaire
    paragraphs:
    - Arrêtez le véhicule dès que vous pouvez le faire en sécurité. Si vous êtes déjà
      à l'arrêt, restez à l'arrêt.
    - Nous n'avons pas pu faire correspondre votre voyant à une image de la notice. Sa
      signification et la consigne du constructeur applicable n'ont pas été établies.
    - Faites vérifier la situation par une personne avant de reprendre la route.
  other_colour:
    heading: Voyant non identifié — vérification humaine nécessaire
    paragraphs:
    - Nous n'avons pas pu faire correspondre votre voyant à une image de la notice. La
      couleur que vous avez choisie ne suffit pas à établir sa signification ni à savoir
      s'il est sûr de rouler.
    - Ce résultat ne vous autorise pas à continuer à rouler. Faites vérifier la situation
      par une personne avant de décider de continuer.
