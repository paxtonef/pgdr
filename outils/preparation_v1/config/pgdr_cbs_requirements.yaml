requirements:
- id: PGDR-V1-01
  required_result: Recevoir le passage VIR puis la photo avec consentement.
  constraints:
  - Le consentement nomme tous les destinataires effectifs.
  - Photo non conservée après le parcours.
  evidence_refs:
  - Consigne V1 du propriétaire ; raccordement applicatif à réaliser
- id: PGDR-V1-02
  required_result: Afficher toutes les images de la notice applicable avec tri facultatif.
  constraints:
  - Le modèle trie seulement, sans repérage, filtre, masque ou affirmation.
  - 'Sans modèle ou tri invalide : ordre de la notice.'
  - Bouton voir toutes les images toujours visible.
  evidence_refs:
  - Consigne V1 du propriétaire ; raccordement applicatif à réaliser
- id: PGDR-V1-03
  required_result: Permettre la sélection humaine multiple et restituer exactement
    les passages et pages.
  constraints:
  - Aucune sélection implicite.
  - Aucune sortie du modèle dans la restitution constructeur.
  evidence_refs:
  - Consigne V1 du propriétaire ; raccordement applicatif à réaliser
- id: PGDR-V1-04
  required_result: Traiter aucune ne correspond et je ne sais pas par couleur déclarée
    et vérification humaine.
  constraints:
  - 'Rouge ou incertain : consigne d’arrêt.'
  - Jamais de permission implicite de rouler.
  evidence_refs:
  - Consigne V1 du propriétaire ; raccordement applicatif à réaliser
