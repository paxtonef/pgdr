[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgdr"
version = "2.0.0"
description = "Pre-Garage Diagnostic Runner"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    # P8 / P2.2 migration — GGM Governed Consumption Integration. `ggm` is
    # NOT on PyPI: it is the pinned GGM package supplied out-of-band (see
    # docs/architecture/p8_ggm_integration.md and the PGDR -> GGM P2.2
    # Pre-Implementation Evidence Note v1).
    #
    # Packaging Identity Freeze (this pin):
    #   package version : ggm 1.2.0
    #   source commit   : ac99750 (SUPPLIED target identity — the source
    #                      archive contains no .git metadata, so this
    #                      commit is not independently git-verifiable
    #                      from the tree alone; see evidence note §1/§3)
    #   wheel SHA-256   : 7340c166918e5b9bb83008a8f5944ef0ae64b0c1995189fc3860d7a90b1baff2
    #   wheel file      : vendor/ggm-1.2.0-py3-none-any.whl
    #
    # Version "1.2.0" is an externally-assigned packaging version, not
    # sourced from any canonical GGM version file (none exists in the
    # supplied source). It must be confirmed or overridden by GGM's own
    # canonical build/release process before being treated as
    # authoritative beyond this migration. See vendor/GGM_PACKAGING_IDENTITY.md
    # for the full freeze record.
    #
    # Declared as a formal dependency anyway (rather than omitted) so
    # `pip install pgdr-*.whl` fails loudly and immediately if ggm isn't
    # already available/co-installed, instead of succeeding and then
    # failing confusingly at import time. Install both wheels together:
    #   pip install ggm-1.2.0-py3-none-any.whl pgdr-2.0.0-py3-none-any.whl
    "ggm>=1.2.0",
]

[project.scripts]
pgdr = "pgdr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgdr"]

# P0.1 — the 4 governance YAML files must ship inside the wheel and be
# loadable via importlib.resources against the pgdr.config package (see
# config_loader.py), not via a path relative to __file__ that only exists
# in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"src/pgdr/config/safety_rules.yaml" = "pgdr/config/safety_rules.yaml"
"src/pgdr/config/symptom_taxonomy.yaml" = "pgdr/config/symptom_taxonomy.yaml"
"src/pgdr/config/questions.yaml" = "pgdr/config/questions.yaml"
"src/pgdr/config/business_rules.yaml" = "pgdr/config/business_rules.yaml"

[tool.pytest.ini_options]
markers = [
    "packaging: builds a real wheel + fresh venv (P0.1 proof) — slower, needs network for pip install",
]
