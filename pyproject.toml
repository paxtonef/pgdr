[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgdr"
version = "2.0.0"
description = "Pre-Garage Diagnostic Runner"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    # Production deployment dependencies — minimal web layer (FastAPI)
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # P8 / P2.2 migration — GGM Governed Consumption Integration. `ggm` is
    # NOT on PyPI: it is the canonical GGM release artifact supplied
    # out-of-band (see docs/architecture/p8_ggm_integration.md).
    #
    # Canonical GGM identity (this pin):
    #   package version : ggm 1.0.0
    #   release commit  : 5fdea20413ba85503770649cfc6df2699df8af3f
    #   wheel file      : ggm-1.0.0-py3-none-any.whl (NOT committed here)
    #   wheel SHA-256   : 414591587d29adf756f16e39ad03cffe0fa2328c8a41e5bbf3ba6b0aa42799a7
    #   contract 1.3 / runtime ggm/1.1 / resolver 1.3 / manifest 1.0
    #
    # The historical PGDR-built "ggm 1.2.0" wheel is a NON-CANONICAL
    # packaging artifact and must not satisfy this dependency; an exact
    # pin excludes it. Install the canonical wheel out-of-band:
    #   pip install ggm-1.0.0-py3-none-any.whl pgdr-2.0.0-py3-none-any.whl
    "ggm==1.0.0",
]

[project.scripts]
pgdr = "pgdr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgdr"]

# P0.1 — the 4 governance YAML files must ship inside the wheel and be
# loadable via importlib.resources against the pgdr.config package (see
# config_loader.py), not via a path relative to __file__ that only exists
# in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"src/pgdr/config/safety_rules.yaml" = "pgdr/config/safety_rules.yaml"
"src/pgdr/config/symptom_taxonomy.yaml" = "pgdr/config/symptom_taxonomy.yaml"
"src/pgdr/config/questions.yaml" = "pgdr/config/questions.yaml"
"src/pgdr/config/business_rules.yaml" = "pgdr/config/business_rules.yaml"

[tool.pytest.ini_options]
markers = [
    "packaging: builds a real wheel + fresh venv (P0.1 proof) — slower, needs network for pip install",
]
